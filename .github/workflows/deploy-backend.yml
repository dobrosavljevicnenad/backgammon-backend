name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # BackendApplicationTests needs a running MySQL, so it is skipped in CI.
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B package -Dtest='!BackendApplicationTests' -Dsurefire.failIfNoSpecifiedTests=false
